[build]
  command = "npm run build:netlify"
  publish = "dist/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.13.0"

[[redirects]]
  from = "/api/supabase-config"
  to = "/.netlify/functions/supabase-config"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
